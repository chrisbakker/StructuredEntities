name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"   # triggers on tags like 1.2.3

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin and views
        run: npm run build:all

      - name: Package
        run: make package

      # Obsidian's plugin installer fetches these three files individually
      # from the release assets. The zip is for manual installs.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/structured-entities/main.js
            dist/structured-entities/manifest.json
            dist/structured-entities/styles.css
            dist/structured-entities.zip
